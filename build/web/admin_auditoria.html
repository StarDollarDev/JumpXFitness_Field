<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-shield-lock me-2"></i>Auditoría del sistema</h2>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="row g-2 mb-3">
                    <div class="col-md-3">
                        <select id="f-tabla" class="form-select">
                            <option value="">Todas las tablas</option>
                            <option value="usuario">usuario</option>
                            <option value="cliente">cliente</option>
                            <option value="producto">producto</option>
                            <option value="categoria">categoria</option>
                            <option value="venta">venta</option>
                            <option value="reservacancha">reservacancha</option>
                            <option value="registrojumping">registrojumping</option>
                            <option value="planjumping">planjumping</option>
                            <option value="horario">horario</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="f-accion" class="form-select">
                            <option value="">Todas las acciones</option>
                            <option value="INSERT">INSERT</option>
                            <option value="UPDATE">UPDATE</option>
                            <option value="DELETE">DELETE</option>
                            <option value="LOGIN">LOGIN</option>
                            <option value="LOGOUT">LOGOUT</option>
                            <option value="LOGIN_FALLIDO">LOGIN_FALLIDO</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-info text-white w-100" onclick="cargarTablaAuditoria()">Filtrar</button>
                    </div>
                </div>
                <table id="tabla-auditoria" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Tabla</th><th>Registro</th><th>Detalle</th><th>IP</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_auditoria.js"></script>
</body>
</html>
