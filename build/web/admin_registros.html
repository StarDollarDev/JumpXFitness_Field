<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros Jumping · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-clipboard-check me-2"></i>Registros de Jumping</h2>
            <div class="d-flex gap-2">
                <input type="date" class="form-control" id="filtro_fecha" style="max-width:200px;">
                <button class="btn btn-info text-white fw-bold text-nowrap" onclick="abrirModalRegistro()">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo registro
                </button>
            </div>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <table id="tabla-registros" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>Cliente</th><th>Plan</th><th>Horario</th><th>Método</th><th>Monto</th><th>Acciones</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Nuevo registro de Jumping</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-registro">
                    <div class="modal-body">
                        <h6 class="text-muted">Cliente</h6>
                        <div class="row g-2 align-items-end mb-2">
                            <div class="col-md-3">
                                <label class="form-label">Tipo doc.</label>
                                <select class="form-select" id="rg_doc_tipo"><option>DNI</option><option>CE</option><option>Pasaporte</option></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">N° documento</label>
                                <input type="text" class="form-control" id="rg_doc_num">
                            </div>
                            <div class="col-md-5">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="buscarClienteRegistro()">
                                    <i class="bi bi-search me-1"></i> Buscar cliente
                                </button>
                            </div>
                        </div>
                        <div id="rg_cliente_info" class="alert alert-success py-2 d-none"></div>
                        <div id="rg_cliente_nuevo" class="row g-2 d-none">
                            <div class="col-12"><small class="text-muted">Cliente no encontrado: completa sus datos y se registrará automáticamente.</small></div>
                            <div class="col-md-4"><label class="form-label">Nombres</label><input type="text" class="form-control" id="rg_nombre"></div>
                            <div class="col-md-4"><label class="form-label">Apellidos</label><input type="text" class="form-control" id="rg_apellido"></div>
                            <div class="col-md-4"><label class="form-label">Teléfono</label><input type="text" class="form-control" id="rg_telefono"></div>
                        </div>

                        <hr>
                        <h6 class="text-muted">Sesión</h6>
                        <div class="row g-2">
                            <div class="col-md-3"><label class="form-label">Fecha</label><input type="date" class="form-control" id="rg_fecha"></div>
                            <div class="col-md-3"><label class="form-label">Horario</label><select class="form-select" id="rg_horario"></select></div>
                            <div class="col-md-3"><label class="form-label">Plan</label><select class="form-select" id="rg_plan"></select></div>
                            <div class="col-md-3"><label class="form-label">Método pago</label>
                                <select class="form-select" id="rg_metodo"><option value="EFECTIVO">Efectivo</option><option value="YAPE">Yape</option></select>
                            </div>
                            <div class="col-md-3"><label class="form-label">Monto (S/)</label><input type="number" step="0.01" class="form-control" id="rg_monto"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-info text-white">Registrar sesión</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_registros.js"></script>
</body>
</html>
