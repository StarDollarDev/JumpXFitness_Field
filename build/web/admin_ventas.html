<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas y Reportes · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-cash-coin me-2"></i>Ventas y Reportes</h2>
            <button class="btn btn-info text-white fw-bold" onclick="abrirModalVenta()">
                <i class="bi bi-plus-circle me-1"></i> Nueva venta
            </button>
        </div>

        <!-- RESUMEN DEL DÍA -->
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body">
                <div class="text-muted small">Ventas del día</div>
                <div class="fs-4 fw-bold" id="rep-cantidad">—</div>
            </div></div></div>
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body">
                <div class="text-muted small">Ingresos del día</div>
                <div class="fs-4 fw-bold" id="rep-total">—</div>
            </div></div></div>
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body">
                <div class="text-muted small">Efectivo</div>
                <div class="fs-4 fw-bold" id="rep-efectivo">—</div>
            </div></div></div>
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body">
                <div class="text-muted small">Yape</div>
                <div class="fs-4 fw-bold" id="rep-yape">—</div>
            </div></div></div>
        </div>

        <!-- VENTAS SEMANA -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header"><i class="bi bi-graph-up me-2"></i>Ventas de la última semana</div>
            <div class="card-body">
                <canvas id="grafico-semana" height="80"></canvas>
            </div>
        </div>

        <!-- REPORTE DIARIO -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-muted mb-0">Reporte diario</h5>
            <input type="date" class="form-control" id="rep_fecha" style="max-width:200px;">
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <table id="tabla-ventas" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>#</th><th>Cliente</th><th>Método</th><th>Total</th><th>Acciones</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL NUEVA VENTA -->
    <div class="modal fade" id="modalVenta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Nueva venta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Producto</label>
                            <select class="form-select" id="vt_producto"></select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="vt_cantidad" value="1" min="1">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-success w-100" onclick="agregarAlCarrito()">
                                <i class="bi bi-cart-plus me-1"></i> Agregar
                            </button>
                        </div>
                    </div>

                    <table class="table table-sm">
                        <thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead>
                        <tbody id="carrito-body">
                            <tr><td colspan="5" class="text-center text-muted">Carrito vacío</td></tr>
                        </tbody>
                        <tfoot>
                            <tr class="fw-bold">
                                <td colspan="3" class="text-end">TOTAL</td>
                                <td id="carrito-total">S/ 0.00</td><td></td>
                            </tr>
                        </tfoot>
                    </table>

                    <hr>
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label">Método de pago</label>
                            <select class="form-select" id="vt_metodo">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="YAPE">Yape</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Cliente (opcional)</label>
                            <div class="input-group">
                                <select class="form-select" id="vt_doc_tipo" style="max-width:110px;">
                                    <option>DNI</option><option>CE</option><option>Pasaporte</option>
                                </select>
                                <input type="text" class="form-control" id="vt_doc_num" placeholder="N° documento">
                                <button class="btn btn-outline-secondary" onclick="buscarClienteVenta()">Buscar</button>
                            </div>
                            <small class="text-muted">Déjalo vacío para una venta sin cliente.</small>
                            <div id="vt_cliente_info" class="alert alert-success py-1 mt-2 d-none small"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-info text-white" onclick="registrarVenta()">Registrar venta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLE -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Detalle de la venta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detalle-body"></div>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_ventas.js"></script>
</body>
</html>
