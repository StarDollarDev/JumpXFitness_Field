# Copia este archivo como: <CATALINA_BASE>/conf/jx-notify.properties
# (la carpeta "conf" de TU instalación de Tomcat, junto a server.xml)
# O, más simple y sin depender de encontrar esa carpeta: define estos mismos
# nombres como variables de entorno de tu usuario (Notificador.java las busca
# primero ahí). NUNCA subas el archivo real (con tus claves) a un repositorio Git.

# --- Canal 1: WhatsApp vía wsp-service/ (Baileys, no oficial, gratis) ---
# 1) Instala Node.js LTS y, dentro de la carpeta wsp-service/, corre: npm install
# 2) Ejecuta: node index.js  y escanea el QR con el WhatsApp del propietario
#    (Ajustes > Dispositivos vinculados > Vincular dispositivo).
# 3) Deja ese proceso corriendo siempre que el servidor esté activo.
# JX_WSP_TELEFONO: número(s) que reciben el aviso, con código de país y sin "+"
# (ej. 51987654321). Puedes poner varios separados por coma.
JX_WSP_URL=http://127.0.0.1:3001/enviar
JX_WSP_TELEFONO=
JX_WSP_SECRET=

# --- Canal 2: Correo por Resend - plan gratis: 100 correos/día, 3000/mes ---
# 1) Crea una cuenta gratuita en https://resend.com
# 2) Genera una API Key en Resend > API Keys.
# 3) JX_MAIL_FROM: mientras NO verifiques un dominio propio en Resend > Domains,
#    solo puedes usar "onboarding@resend.dev" como remitente, y Resend solo te
#    dejará enviar a la casilla con la que te registraste (modo de prueba).
#    Para que llegue a cualquier correo (ej. el buzón real del negocio),
#    verifica tu propio dominio en Resend y usa un remitente de ese dominio,
#    ej. notificaciones@jumpxfitness.com
JX_RESEND_API_KEY=
JX_MAIL_FROM=onboarding@resend.dev
JX_MAIL_FROM_NAME=JumpxFitness
JX_MAIL_TO=correo@jumpxfitness.com
