<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos Yape · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
<body class="jx-show-loading">
    <div id="jx-loading-overlay">
        <img src="assets/img/logo.png" alt="JumpxFitness">
        <div class="spinner-border" role="status"></div>
        <p>Cargando panel administrativo...</p>
    </div>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-phone-vibrate me-2"></i>Pagos por Yape pendientes</h2>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <p class="text-muted small">
                    Verifica cada código de operación en tu propia app de Yape antes de confirmar.
                    Al confirmar, se crea automáticamente el registro que extiende la vigencia del cliente.
                </p>
                <table id="tabla-pagos-yape" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>Fecha</th><th>Cliente</th><th>Plan</th><th>Monto</th><th>Celular</th><th>Código</th><th>Acciones</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_pagos_yape.js"></script>
</body>
</html>
