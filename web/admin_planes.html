<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes Jumping · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-lightning-charge me-2"></i>Planes de Jumping</h2>
            <button class="btn btn-info text-white fw-bold" onclick="abrirModalNuevo()">
                <i class="bi bi-plus-circle me-2"></i> Nuevo plan
            </button>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <table id="tabla-planes" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>Imagen</th><th>Nombre</th><th>Precio</th><th>Personas</th><th>Vigencia</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalPlan" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="tituloModalPlan">Nuevo plan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-plan" enctype="multipart/form-data">
                    <div class="modal-body">
                        <input type="hidden" id="plan_id">
                        <div class="mb-3 text-center">
                            <img id="plan_imagen_preview" src="" class="rounded d-none" style="max-width:140px; max-height:140px; object-fit:cover;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen del plan</label>
                            <input type="file" id="plan_imagen" name="imagen" class="form-control" accept="image/*" onchange="previsualizarImagenPlan(this)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="plan_nombre" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Precio (S/)</label>
                                <input type="number" step="0.01" id="plan_precio" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N° personas</label>
                                <input type="number" id="plan_personas" class="form-control" value="1" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Días vigencia</label>
                                <input type="number" id="plan_dias" class="form-control" value="1" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-info text-white">Guardar plan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_planes.js"></script>
</body>
</html>
