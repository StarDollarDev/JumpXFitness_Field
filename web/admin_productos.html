<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos y Stock · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-box-seam me-2"></i>Productos y Stock</h2>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-success" onclick="abrirModalCategoria()">
                    <i class="bi bi-tags me-1"></i> Categorías
                </button>
                <button class="btn btn-info text-white fw-bold text-nowrap" onclick="abrirModalProducto()">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo producto
                </button>
            </div>
        </div>

        <div id="alerta-stock" class="alert alert-warning d-none">
            <i class="bi bi-exclamation-triangle me-1"></i>
            <span id="alerta-stock-texto"></span>
        </div>

        <div class="card shadow border-0">
            <div class="card-body p-4">
                <table id="tabla-productos" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr>
                            <th>Producto</th><th>Categoría</th><th>P. compra</th>
                            <th>P. venta</th><th>Stock</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="tituloModalProducto">Nuevo producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-producto">
                    <div class="modal-body">
                        <input type="hidden" id="pr_id">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="pr_nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="pr_descripcion">
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label">Precio compra (S/)</label>
                                <input type="number" step="0.01" class="form-control" id="pr_precio_compra" value="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Precio venta (S/)</label>
                                <input type="number" step="0.01" class="form-control" id="pr_precio_venta" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Stock</label>
                                <input type="number" class="form-control" id="pr_stock" value="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" id="pr_categoria" required></select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-info text-white">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL CATEGORIAS -->
    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Categorías</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="cat_nombre" placeholder="Nueva categoría">
                        <button class="btn btn-info text-white" onclick="guardarCategoria()">Agregar</button>
                    </div>
                    <ul class="list-group" id="lista-categorias"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL STOCK -->
    <div class="modal fade" id="modalStock" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Ajustar stock</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2 fw-bold" id="stock_producto_nombre"></p>
                    <input type="hidden" id="stock_id">
                    <label class="form-label">Cantidad a ingresar</label>
                    <input type="number" class="form-control mb-3" id="stock_cantidad" value="1" min="1">
                    <div class="d-grid gap-2">
                        <button class="btn btn-success" onclick="ajustarStock('aumentarStock')">
                            <i class="bi bi-plus-lg me-1"></i> Aumentar
                        </button>
                        <button class="btn btn-outline-danger" onclick="ajustarStock('reducirStock')">
                            <i class="bi bi-dash-lg me-1"></i> Reducir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_productos.js"></script>
</body>
</html>
