<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas Cancha · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-grid-3x3-gap me-2"></i>Reservas de Cancha</h2>
            <div class="d-flex gap-2">
                <input type="date" class="form-control" id="filtro_fecha" style="max-width:200px;">
                <button class="btn btn-info text-white fw-bold text-nowrap" onclick="abrirModalReserva()">
                    <i class="bi bi-plus-circle me-1"></i> Nueva reserva
                </button>
            </div>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <table id="tabla-reservas" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>Cliente</th><th>Deporte</th><th>Hora</th><th>Total</th><th>Falta</th><th>Pago</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalReserva" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Nueva reserva de cancha</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-reserva">
                    <div class="modal-body">
                        <h6 class="text-muted">Cliente</h6>
                        <div class="row g-2 align-items-end mb-2">
                            <div class="col-md-3">
                                <label class="form-label">Tipo doc.</label>
                                <select class="form-select" id="rs_doc_tipo"><option>DNI</option><option>CE</option><option>Pasaporte</option></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">N° documento</label>
                                <input type="text" class="form-control" id="rs_doc_num">
                            </div>
                            <div class="col-md-5">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="buscarClienteReserva()">
                                    <i class="bi bi-search me-1"></i> Buscar cliente
                                </button>
                            </div>
                        </div>
                        <div id="rs_cliente_info" class="alert alert-success py-2 d-none"></div>
                        <div id="rs_cliente_nuevo" class="row g-2 d-none">
                            <div class="col-12"><small class="text-muted">Cliente no encontrado: completa sus datos y se registrará automáticamente.</small></div>
                            <div class="col-md-4"><label class="form-label">Nombres</label><input type="text" class="form-control" id="rs_nombre"></div>
                            <div class="col-md-4"><label class="form-label">Apellidos</label><input type="text" class="form-control" id="rs_apellido"></div>
                            <div class="col-md-4"><label class="form-label">Teléfono</label><input type="text" class="form-control" id="rs_telefono"></div>
                        </div>

                        <hr>
                        <h6 class="text-muted">Reserva</h6>
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label class="form-label">Deporte</label>
                                <select class="form-select" id="rs_deporte">
                                    <option value="FUTBOL">Fútbol</option>
                                    <option value="VOLEY">Vóley</option>
                                </select>
                            </div>
                            <div class="col-md-3"><label class="form-label">Fecha</label><input type="date" class="form-control" id="rs_fecha"></div>
                            <div class="col-md-3"><label class="form-label">Hora inicio</label><input type="time" class="form-control" id="rs_hora_inicio"></div>
                            <div class="col-md-3"><label class="form-label">Hora fin</label><input type="time" class="form-control" id="rs_hora_fin"></div>
                        </div>
                        <div class="row g-2 mt-1">
                            <div class="col-md-3"><label class="form-label">Precio x hora (S/)</label><input type="number" step="0.01" class="form-control" id="rs_precio_hora" value="30"></div>
                            <div class="col-md-3">
                                <label class="form-label">Método pago</label>
                                <select class="form-select" id="rs_metodo"><option value="EFECTIVO">Efectivo</option><option value="YAPE">Yape</option></select>
                            </div>
                            <div class="col-md-3"><label class="form-label">Adelanto (S/)</label><input type="number" step="0.01" class="form-control" id="rs_adelanto" value="0"></div>
                            <div class="col-md-3">
                                <label class="form-label">Estado de pago</label>
                                <select class="form-select" id="rs_estado_pago"><option value="PENDIENTE">Pendiente</option><option value="PAGADO">Pagado</option></select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-info text-white">Registrar reserva</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_reservas.js"></script>
</body>
</html>
