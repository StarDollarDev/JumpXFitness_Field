<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administradores · Admin</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
</head>
    <header id="header-placeholder"></header>
    <main class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title"><i class="bi bi-person-badge me-2"></i>Administradores</h2>
            <button class="btn btn-info text-white fw-bold" onclick="abrirModalNuevo()">
                <i class="bi bi-plus-circle me-2"></i> Nuevo administrador
            </button>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <table id="tabla-usuarios" class="table table-striped table-hover w-100">
                    <thead class="table-info">
                        <tr><th>Usuario</th><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Acciones</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Nuevo administrador</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-usuario">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombres</label>
                                <input type="text" id="u_nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos</label>
                                <input type="text" id="u_apellido" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo documento</label>
                                <select id="u_documento" class="form-select">
                                    <option>DNI</option><option>CE</option><option>Pasaporte</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">N° documento</label>
                                <input type="text" id="u_numeroDoc" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" id="u_telefono" class="form-control">
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" id="u_usuario" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="u_password" class="form-control" placeholder="Dejar vacío para no cambiarla" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-info text-white">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/admin_usuarios.js"></script>
</body>
</html>
