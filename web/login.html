<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | JumpxFitness</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <div id="head-placeholder"></div>
    <style>
        .jx-auth-switch {
            display: flex;
            background: #f4e7e8;
            border-radius: 999px;
            padding: 4px;
            gap: 4px;
        }
        .jx-auth-switch-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 12px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .95rem;
            color: #8a5b60;
            transition: background .15s ease, color .15s ease;
        }
        .jx-auth-switch-btn.active {
            background: var(--jx-red-dark, #b94f59);
            color: #fff;
        }
        .jx-auth-pane { display: none; }
        .jx-auth-pane.active { display: block; }

        /* Esta pantalla es de acceso público (login/registro): no debe
           mostrar el sidebar ni el espacio reservado para él. */
        body.jx-auth-page #jxSidebar,
        body.jx-auth-page #jx-mobile-topbar,
        body.jx-auth-page #jx-sidebar-backdrop {
            display: none !important;
        }
        body.jx-auth-page {
            padding-left: 0 !important;
            padding-top: 0 !important;
        }
    </style>
</head>
<body class="jx-auth-page">
    <div id="jx-loading-overlay">
        <img src="assets/img/logo.png" alt="JumpxFitness">
        <div class="spinner-border" role="status"></div>
        <p>Cargando acceso...</p>
    </div>
    <header id="header-placeholder"></header>
    <main>
        <div class="d-flex align-items-center justify-content-center px-3 py-5" style="min-height: 90vh;">
            <div class="card shadow-sm border-0" style="max-width: 460px; width: 100%;">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img src="assets/img/logo.png" alt="JumpxFitness" class="rounded-3 mb-2" style="width: 90px; height: 90px; object-fit: cover;">
                        <h4 class="fw-bold mt-2">Bienvenido a JumpxFitness</h4>
                        <p class="text-muted small mb-0">Inicia sesión o crea tu cuenta de cliente</p>
                    </div>

                    <div class="jx-auth-switch mb-4">
                        <button type="button" class="jx-auth-switch-btn active" id="tab-btn-login" onclick="jxCambiarTabAuth('login')">Iniciar sesión</button>
                        <button type="button" class="jx-auth-switch-btn" id="tab-btn-registro" onclick="jxCambiarTabAuth('registro')">Crear cuenta</button>
                    </div>

                    <!-- LOGIN -->
                    <div class="jx-auth-pane active" id="tab-login">
                        <form id="form-login">
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input id="usuario" type="text" name="usuario" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input id="password" type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-jx-primary w-100 fw-bold">Ingresar</button>
                        </form>
                    </div>

                    <!-- REGISTRO (siempre como cliente; el rol ADMIN no es seleccionable aquí) -->
                    <div class="jx-auth-pane" id="tab-registro">
                        <form id="form-registro">
                            <div class="mb-3">
                                <label class="form-label">Tipo de cuenta</label>
                                <input type="text" class="form-control" value="Cliente" disabled>
                            </div>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label for="reg-nombre" class="form-label">Nombre *</label>
                                    <input id="reg-nombre" type="text" class="form-control" required minlength="2" maxlength="60">
                                </div>
                                <div class="col-md-6">
                                    <label for="reg-apellido" class="form-label">Apellido *</label>
                                    <input id="reg-apellido" type="text" class="form-control" required minlength="2" maxlength="60">
                                </div>
                                <div class="col-md-5">
                                    <label for="reg-tipo-doc" class="form-label">Documento *</label>
                                    <select id="reg-tipo-doc" class="form-select" required>
                                        <option value="" selected disabled>Selecciona...</option>
                                        <option value="DNI">DNI</option>
                                        <option value="CE">Carné de Extranjería</option>
                                    </select>
                                </div>
                                <div class="col-md-7">
                                    <label for="reg-numero-doc" class="form-label">N.° documento *</label>
                                    <input id="reg-numero-doc" type="text" class="form-control" required minlength="6" maxlength="15">
                                </div>
                                <div class="col-12">
                                    <label for="reg-telefono" class="form-label">Teléfono *</label>
                                    <input id="reg-telefono" type="text" class="form-control" required placeholder="Ej. 987654321">
                                </div>
                                <div class="col-12">
                                    <label for="reg-usuario" class="form-label">Usuario *</label>
                                    <input id="reg-usuario" type="text" class="form-control" required minlength="4" maxlength="40">
                                </div>
                                <div class="col-12">
                                    <label for="reg-password" class="form-label">Contraseña *</label>
                                    <input id="reg-password" type="password" class="form-control" required minlength="8"
                                           pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                                           title="Debe tener al menos 8 caracteres, una mayúscula y un número">
                                    <div class="form-text">Mínimo 8 caracteres, con al menos una mayúscula y un número.</div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-jx-primary w-100 fw-bold mt-3">Crear cuenta</button>
                        </form>
                    </div>

                    <div class="text-center mt-3">
                        <a href="index.html" class="small text-decoration-none">← Volver a JumpxFitness</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="assets/js/main.js"></script>
</body>
</html>
